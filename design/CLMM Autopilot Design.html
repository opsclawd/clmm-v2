<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>CLMM Autopilot — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  body { background: #05080C; }
  .dc-title { color: var(--fg-1) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ui-atoms.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

const PHONE_W = 390;
const PHONE_H = 812;

function Stage({ children }) {
  return <Phone width={PHONE_W} height={PHONE_H}>{children}</Phone>;
}

function App() {
  return (
    <DesignCanvas title="CLMM Autopilot" subtitle="Design polish · 8 screens · mobile">
      <DCSection id="onboarding" title="01 · Onboarding" subtitle="First-run state — before any wallet is connected">
        <DCArtboard id="connect" label="Connect wallet" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenConnect/></Stage>
        </DCArtboard>
      </DCSection>

      <DCSection id="monitoring" title="02 · Monitoring" subtitle="The calm default — 'nothing is wrong' must still feel intentional">
        <DCArtboard id="positions" label="Positions list" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenPositions/></Stage>
        </DCArtboard>
        <DCArtboard id="detail-safe" label="Position · in range" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenPositionSafe/></Stage>
        </DCArtboard>
      </DCSection>

      <DCSection id="protection" title="03 · Protection flow" subtitle="Breach detected → user reviews → signs exit">
        <DCArtboard id="breach" label="Position · breach" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenBreach/></Stage>
        </DCArtboard>
        <DCArtboard id="exit" label="Review &amp; sign exit" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenExit/></Stage>
        </DCArtboard>
      </DCSection>

      <DCSection id="context" title="04 · Market context" subtitle="Regime engine — decision support, not auto-trading">
        <DCArtboard id="regime" label="Regime · SOL" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenRegime/></Stage>
        </DCArtboard>
      </DCSection>

      <DCSection id="account" title="05 · Account &amp; audit" subtitle="History receipts and wallet management">
        <DCArtboard id="history" label="History &amp; receipts" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenHistory/></Stage>
        </DCArtboard>
        <DCArtboard id="wallet" label="Wallet &amp; settings" width={PHONE_W} height={PHONE_H}>
          <Stage><ScreenWallet/></Stage>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
